<script>
/* ==========================================================
   DATA
   ----------------------------------------------------------
   Courses live ENTIRELY in files/courses.csv — no course data is
   duplicated here. This page only fetches and renders that CSV.
   Columns: code | title | semester | description | topics | grading | syllabus
     - syllabus: link to the syllabus HTML/PDF (e.g.
       files/cs50600-syllabus.html) or an external page. Leave empty
       to show "Syllabus coming soon."
   Requires the site to be served over HTTP (Live Server / GitHub
   Pages) — opening this page directly via file:// cannot fetch local
   files, so courses won't load that way; see the error message below.
   ========================================================== */
const COURSES_SHEET_URL = "files/courses.csv";

function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (cur !== "" || row.length) { row.push(cur); rows.push(row); row = []; cur = ""; }
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function renderCourses(list) {
  document.getElementById("course-list").innerHTML = list.map((c, i) => `
    <div class="acc" id="course-${i}">
      <button class="acc-head" aria-expanded="false">
        <span class="badge b-code">${c.code}</span>
        <span class="acc-title">${c.title}</span>
        <span class="acc-meta">${c.semester || ""}</span>
        <span class="chev">+</span>
      </button>
      <div class="acc-body">
        ${c.description ? `<div class="p-field"><h5>About</h5><p>${c.description}</p></div>` : ""}
        ${(c.topics || "").trim() ? `<div class="p-field"><h5>Topics</h5><p>${c.topics}</p></div>` : ""}
        ${(c.grading || "").trim() ? `<div class="p-field"><h5>Grading</h5><p>${c.grading}</p></div>` : ""}
        ${(c.syllabus || "").trim()
          ? `<a class="syll-link" href="${c.syllabus}" target="_blank" rel="noopener">Syllabus</a>`
          : `<p class="ask" style="margin-top:16px;">Syllabus coming soon.</p>`}
      </div>
    </div>`).join("");
}

document.addEventListener("click", e => {
  const head = e.target.closest(".acc-head");
  if (!head) return;
  const acc = head.parentElement;
  const on = acc.classList.toggle("on");
  head.setAttribute("aria-expanded", on);
});

async function loadSheetGeneric(url, apply) {
  if (!url) return false;
  try {
    const res = await fetch(url);
    if (!res.ok) return false;
    const rows = parseCSV(await res.text());
    const head = rows[0].map(h => h.trim().toLowerCase());
    const items = rows.slice(1).filter(r => r.some(c => (c || "").trim()))
      .map(r => Object.fromEntries(head.map((h, j) => [h, r[j] || ""])));
    if (items.length) { apply(items); return true; }
    return false;
  } catch (e) { return false; }
}

document.getElementById("course-list").innerHTML = `<p class="tp-empty">Loading courses…</p>`;
loadSheetGeneric(COURSES_SHEET_URL, renderCourses).then(ok => {
  if (!ok) document.getElementById("course-list").innerHTML =
    `<p class="tp-empty">Could not load files/courses.csv — this page needs to be served over HTTP (Live Server, GitHub Pages, etc.), not opened directly as a file.</p>`;
});
</script>
