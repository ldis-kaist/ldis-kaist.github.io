<script>
/* ==========================================================
   DATA
   ----------------------------------------------------------
   Publications live ENTIRELY in files/publications.csv — no
   publication data is duplicated here. Columns:
     title | authors | conference | year | tags | highlight | pdf | code | status
     - tags: semicolon-separated
     - highlight: leave empty for a normal entry, or put a short note
       (e.g. "Best Paper", "Selected") to show a badge next to the title
     - pdf / code: leave empty if not available yet
     - status: "ongoing" (arXiv preprints / not yet formally published —
       shown in the "Ongoing" section up top) or "published" (shown in
       "Published" below). Leave empty and every row falls back to one
       flat list with no section headers.
   This page fetches that CSV directly (works when served over
   Live Server / GitHub Pages / any static host — NOT when this page
   is opened directly via file://, since browsers block that fetch).
   If the CSV can't be loaded, a clear error message is shown instead
   of any hardcoded data — see loadSheet() below.
   ========================================================== */
const PUBS_SHEET_URL = "files/publications.csv";

let papers = [];

function pubHTML(p) {
  const links = [];
  if (p.pdf && p.pdf !== "") links.push(`<a href="${p.pdf}">PDF</a>`);
  if (p.code && p.code !== "") links.push(`<a href="${p.code}">Code</a>`);
  return `<div class="pub-item">
    <span class="pub-venue">${p.conference} ${p.year}</span>
    <div>
      <div class="pub-title">${p.title}${p.highlight ? ` <span class="pub-highlight">${p.highlight}</span>` : ""}</div>
      <div class="pub-authors">${p.authors}</div>
      <div class="pub-meta">${links.join("")}
        <span class="pub-tags">${pubTagsHTML(p.tags)}</span>
      </div>
    </div>
  </div>`;
}

function byYearDesc(a, b) { return (parseInt(b.year) || 0) - (parseInt(a.year) || 0); }

function renderPubs() {
  const ongoingSec = document.getElementById("pub-ongoing-section");
  const publishedSec = document.getElementById("pub-published-section");
  const flatList = document.getElementById("pub-list-flat");

  if (!papers.length) {
    ongoingSec.hidden = true; publishedSec.hidden = true;
    flatList.hidden = false;
    flatList.innerHTML = `<p class="tp-empty">Publications are on the way.</p>`;
    return;
  }

  const hasStatus = papers.some(p => p.status === "ongoing" || p.status === "published");
  if (!hasStatus) {
    // No status column filled in — fall back to one flat list, newest first.
    ongoingSec.hidden = true; publishedSec.hidden = true;
    flatList.hidden = false;
    flatList.innerHTML = papers.slice().sort(byYearDesc).map(pubHTML).join("");
    return;
  }

  const ongoing = papers.filter(p => p.status === "ongoing").sort(byYearDesc);
  const published = papers.filter(p => p.status !== "ongoing").sort(byYearDesc);

  flatList.hidden = true;
  ongoingSec.hidden = !ongoing.length;
  publishedSec.hidden = !published.length;
  document.getElementById("pub-list-ongoing").innerHTML = ongoing.map(pubHTML).join("");
  document.getElementById("pub-list-published").innerHTML = published.map(pubHTML).join("");
}

function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (cur !== "" || row.length) { row.push(cur); rows.push(row); row = []; cur = ""; }
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

async function loadSheet() {
  if (!PUBS_SHEET_URL) return false;
  try {
    const res = await fetch(PUBS_SHEET_URL);
    if (!res.ok) return false;
    const rows = parseCSV(await res.text());
    const head = rows[0].map(h => h.trim().toLowerCase());
    const idx = k => head.indexOf(k);
    const loaded = rows.slice(1).filter(r => r[idx("title")]).map(r => ({
      title: r[idx("title")], authors: r[idx("authors")],
      conference: r[idx("conference")], year: r[idx("year")],
      tags: (r[idx("tags")] || "").split(";").map(s => s.trim()).filter(Boolean),
      highlight: (r[idx("highlight")] || "").trim(),
      pdf: r[idx("pdf")] || "", code: r[idx("code")] || "",
      status: (r[idx("status")] || "").trim().toLowerCase(),
    }));
    if (loaded.length) { papers = loaded; renderPubs(); return true; }
    return false;
  } catch (e) { return false; }
}

document.getElementById("pub-ongoing-section").hidden = true;
document.getElementById("pub-published-section").hidden = true;
document.getElementById("pub-list-flat").innerHTML = `<p class="tp-empty">Loading publications…</p>`;
loadSheet().then(ok => {
  if (!ok) {
    document.getElementById("pub-list-flat").hidden = false;
    document.getElementById("pub-list-flat").innerHTML =
      `<p class="tp-empty">Could not load files/publications.csv — this page needs to be served over HTTP (Live Server, GitHub Pages, etc.), not opened directly as a file.</p>`;
  }
});
</script>
