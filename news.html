<script>
/* ==========================================================
   DATA
   ----------------------------------------------------------
   News lives ENTIRELY in files/news.csv — no news data is
   duplicated here (the homepage's "latest news" widget reads the
   same file). Columns: date | text
   Requires the site to be served over HTTP (Live Server / GitHub
   Pages / any static host) — NOT when this page is opened directly
   via file://, since browsers block that fetch.
   ========================================================== */
const NEWS_SHEET_URL = "files/news.csv";

function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (cur !== "" || row.length) { row.push(cur); rows.push(row); row = []; cur = ""; }
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function newsHTML(n) {
  return `<div class="news-item"><span class="news-date">${n.date}</span><p>${n.text}</p></div>`;
}

async function loadNews() {
  const el = document.getElementById("news-list");
  if (!NEWS_SHEET_URL) return false;
  try {
    const res = await fetch(NEWS_SHEET_URL);
    if (!res.ok) return false;
    const rows = parseCSV(await res.text());
    const head = rows[0].map(h => h.trim().toLowerCase());
    const idx = k => head.indexOf(k);
    const items = rows.slice(1).filter(r => r[idx("date")])
      .map(r => ({ date: r[idx("date")], text: r[idx("text")] }));
    if (items.length) { el.innerHTML = items.map(newsHTML).join(""); return true; }
    return false;
  } catch (e) { return false; }
}

document.getElementById("news-list").innerHTML = `<p class="tp-empty">Loading news…</p>`;
loadNews().then(ok => {
  if (!ok) document.getElementById("news-list").innerHTML =
    `<p class="tp-empty">Could not load files/news.csv — this page needs to be served over HTTP (Live Server, GitHub Pages, etc.), not opened directly as a file.</p>`;
});
</script>
